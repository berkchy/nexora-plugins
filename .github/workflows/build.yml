name: build & release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Also publish a versioned release with this tag (e.g. v1.0.0). Empty = rolling continuous only.'
        required: false
        default: ''

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zip >/dev/null
          ./package-plugins.sh all

      - name: Smoke test (arm64)
        shell: bash
        run: |
          set -euo pipefail
          SDK="$PWD/sdk/include"
          INC="$PWD/include"
          g++ -std=gnu++17 -o /tmp/smoketest tools/smoketest.cpp -I"$INC" \
            $(for d in engine common public pm_shared game_shared dlls cl_dll cl_dll/include; do printf -- "-I$SDK/$d "; done) -ldl
          /tmp/smoketest dist/build/arm64-v8a/killfade/*.so dist/build/arm64-v8a/killfeed/*.so dist/build/arm64-v8a/scoreboard2/*.so dist/build/arm64-v8a/csgohud/*.so

      - name: Release (continuous)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view continuous >/dev/null 2>&1; then
            gh release create continuous --title "Nexora Plugins" --notes "Rolling plugin bundles and individual plugin libraries."
          fi
          gh release upload continuous --clobber \
            dist/nexora-plugins-bundle.zip \
            dist/nexora-plugins-bundle-armeabi-v7a.zip \
            dist/build/*/*/lib*.so

      - name: Release (versioned)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          ASSETS="dist/nexora-plugins-bundle.zip dist/nexora-plugins-bundle-armeabi-v7a.zip dist/build/*/*/lib*.so"
          git tag "$TAG"
          git push origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $ASSETS
          else
            gh release create "$TAG" --title "Nexora Plugins $TAG" --notes "Plugin release $TAG." $ASSETS
          fi
